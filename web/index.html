<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: 폰 키보드가 올라오면 화면(레이아웃) 높이를 줄여, 시트 맨 아래 저장 버튼이 키보드 위에 보이게 한다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <!-- 앱 바탕색(index.css --color-bg)과 manifest theme_color(vite.config.ts)를 맞춘다. -->
    <meta name="theme-color" content="#f5f6f8" />
    <meta name="description" content="주기적인 집안일을 게이지와 D-day로 보여 주는 대시보드" />
    <!-- 아이콘은 icons-src/에서 만든다(npm run icons). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>AIFred</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
