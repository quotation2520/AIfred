[project]
name = "aifred-server"
version = "0.1.0"
description = "AIFred 로컬 서버 (FastAPI + SQLite)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlmodel",
    "apscheduler",
    "pywebpush",
    "tzdata",  # Windows에는 시스템 시간대 DB가 없어 zoneinfo가 이 패키지를 쓴다.
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.routers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
